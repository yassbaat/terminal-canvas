<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
  <title>Terminal Canvas</title>
  <script>
    // Applied synchronously, before first paint, so switching themes (or a
    // system dark/light preference) never flashes the wrong colors.
    (function () {
      try {
        var pref = localStorage.getItem("terminal-canvas:theme") || "dark";
        var resolved =
          pref === "system"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light")
            : pref;
        document.documentElement.setAttribute("data-theme", resolved);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/renderer/main.ts"></script>
</body>
</html>
